name: cse-benchmark

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:-cse_benchmark}
      POSTGRES_USER: ${PGUSER:-cse}
      POSTGRES_PASSWORD: ${PGPASSWORD:-cse_local}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data: